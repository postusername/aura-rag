services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama
      - ./rag-server/docker/ollama-init.sh:/ollama-init.sh:ro
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL
    entrypoint: ["/bin/sh", "/ollama-init.sh"]

  rag-server:
    build: ./rag-server
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - KAITEN_TOKEN
      - KAITEN_DOMAIN
      - GOOGLE_API_KEY
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./rag-server/config:/app/config

volumes:
  qdrant_data:
  ollama_data:
