services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  kaiten-mcp:
    build: ./kaiten-mcp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - KAITEN_TOKEN
      - KAITEN_DOMAIN
      - MCP_HTTP_PORT=3000

  ollama:
    image: ollama/ollama:latest
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama
      - ./rag-server/docker/ollama-init.sh:/ollama-init.sh:ro
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL
    entrypoint: ["/bin/sh", "/ollama-init.sh"]

  rag-server:
    build: ./rag-server
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      kaiten-mcp:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - KAITEN_TOKEN
      - KAITEN_DOMAIN
      - GOOGLE_API_KEY
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - KAITEN_MCP_URL=http://kaiten-mcp:3000/sse
    volumes:
      - ./rag-server/config:/app/config

volumes:
  qdrant_data:
  ollama_data:
